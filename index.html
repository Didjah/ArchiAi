<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchiAI — Votre maison, conçue par l'IA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #0a0f1e;
      color: #f0e6c8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #0d1530, #1a2a5e);
      padding: 32px 20px;
      text-align: center;
      border-bottom: 2px solid #c9a84c;
    }

    header h1 {
      font-size: 2.4rem;
      color: #c9a84c;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    header p { font-size: 1rem; color: #b0bcd4; margin-top: 8px; }

    .container { width: 100%; max-width: 800px; padding: 40px 20px; }

    label {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    textarea, input[type="number"], select {
      width: 100%;
      padding: 14px 16px;
      background: #111827;
      border: 1px solid #c9a84c55;
      border-radius: 8px;
      color: #f0e6c8;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      outline: none;
      transition: border 0.3s;
    }

    textarea { resize: vertical; min-height: 100px; }
    textarea:focus, input:focus, select:focus { border-color: #c9a84c; }
    select option { background: #111827; }

    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }

    button#generateBtn {
      margin-top: 24px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c9a84c, #a07830);
      color: #0a0f1e;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    button#generateBtn:hover { opacity: 0.85; }
    button#generateBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loader {
      display: none;
      text-align: center;
      margin-top: 24px;
      color: #c9a84c;
      font-size: 0.95rem;
      letter-spacing: 2px;
    }

    /* IMAGES */
    #image-section { display: none; margin-top: 32px; }

    #image-section h2 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 14px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .image-grid img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #c9a84c33;
      transition: transform 0.2s;
    }

    .image-grid img:hover { transform: scale(1.02); }

    /* RÉSULTAT */
    #result {
      margin-top: 28px;
      background: #111827;
      border: 1px solid #c9a84c44;
      border-radius: 10px;
      padding: 28px;
      display: none;
    }

    #result h2 {
      color: #c9a84c;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    #result-text {
      color: #e8dfc8;
      white-space: pre-wrap;
      font-size: 0.97rem;
      line-height: 1.8;
    }

    /* PDF */
    #pdf-btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: #1a2a5e;
      color: #c9a84c;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid #c9a84c;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #pdf-btn:hover { background: #c9a84c; color: #0a0f1e; }

    /* PARTAGE */
    .share-section { margin-top: 20px; display: none; }

    .share-section p {
      font-size: 0.8rem;
      color: #c9a84c;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .share-buttons { display: flex; flex-wrap: wrap; gap: 10px; }

    .share-btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: white;
      transition: opacity 0.2s;
    }

    .share-btn:hover { opacity: 0.8; }
    .btn-whatsapp { background: #25D366; }
    .btn-telegram { background: #0088CC; }
    .btn-email    { background: #555; }
    .btn-sms      { background: #8e44ad; }
    .btn-linkedin { background: #0077B5; }
    .btn-copy     { background: #c9a84c; color: #0a0f1e; }

    footer {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #3a4a6a;
    }
  </style>
</head>
<body>

<header>
  <h1>ArchiAI</h1>
  <p>Votre maison, conçue par l'IA &nbsp;|&nbsp; Your home, designed by AI</p>
</header>

<div class="container">

  <label for="prompt">Décrivez votre projet</label>
  <textarea id="prompt" placeholder="Ex : Villa avec grande terrasse, vue sur la mer, style moderne..."></textarea>

  <div class="row">
    <div>
      <label for="superficie">Superficie (m²)</label>
      <input type="number" id="superficie" placeholder="Ex : 150" min="20" max="10000" />
    </div>
    <div>
      <label for="style">Style architectural</label>
      <select id="style">
        <option value="moderne">Moderne</option>
        <option value="traditionnel africain">Traditionnel Africain</option>
        <option value="contemporain">Contemporain</option>
        <option value="minimaliste">Minimaliste</option>
        <option value="colonial">Colonial</option>
        <option value="tropical">Tropical</option>
      </select>
    </div>
  </div>

  <button id="generateBtn" onclick="generer()">✦ Générer le plan architectural</button>

  <div id="loader">⏳ Génération en cours...</div>

  <!-- IMAGES DE RÉFÉRENCE -->
  <div id="image-section">
    <h2>🖼️ Références visuelles du projet</h2>
    <div class="image-grid" id="image-grid"></div>
  </div>

  <!-- RÉSULTAT TEXTE -->
  <div id="result">
    <h2>Plan architectural généré</h2>
    <div id="result-text"></div>
  </div>

  <button id="pdf-btn" onclick="telechargerPDF()">📄 Télécharger en PDF</button>

  <!-- PARTAGE -->
  <div class="share-section" id="shareSection">
    <p>Partager</p>
    <div class="share-buttons">
      <button class="share-btn btn-whatsapp" onclick="partager('whatsapp')">WhatsApp</button>
      <button class="share-btn btn-telegram" onclick="partager('telegram')">Telegram</button>
      <button class="share-btn btn-email"    onclick="partager('email')">Email</button>
      <button class="share-btn btn-sms"      onclick="partager('sms')">SMS</button>
      <button class="share-btn btn-linkedin" onclick="partager('linkedin')">LinkedIn</button>
      <button class="share-btn btn-copy"     onclick="partager('copy')">📋 Copier</button>
    </div>
  </div>

</div>

<footer>ArchiAI — Propulsé par Groq IA</footer>

<script>
  let lastResult = '';
  let lastPrompt = '';

  // Images fixes par style — URLs stables hébergées sur images.unsplash.com
  const IMAGES = {
    'moderne': [
      'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=600&q=80',
      'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600&q=80',
      'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600&q=80',
      'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600&q=80'
    ],
    'traditionnel africain': [
      'https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?w=600&q=80',
      'https://images.unsplash.com/photo-1580974852861-c381510bc98a?w=600&q=80',
      'https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=600&q=80',
      'https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=600&q=80'
    ],
    'contemporain': [
      'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=600&q=80',
      'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=600&q=80',
      'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=600&q=80',
      'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=600&q=80'
    ],
    'minimaliste': [
      'https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=600&q=80',
      'https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=600&q=80',
      'https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=600&q=80',
      'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80'
    ],
    'colonial': [
      'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600&q=80',
      'https://images.unsplash.com/photo-1582268611958-ebfd161ef9cf?w=600&q=80',
      'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600&q=80',
      'https://images.unsplash.com/photo-1576941089067-2de3c901e126?w=600&q=80'
    ],
    'tropical': [
      'https://images.unsplash.com/photo-1540541338537-1220059c3cca?w=600&q=80',
      'https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=600&q=80',
      'https://images.unsplash.com/photo-1439130490301-25e322d88054?w=600&q=80',
      'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80'
    ]
  };

  function afficherImages(style) {
    const grid = document.getElementById('image-grid');
    const imageSection = document.getElementById('image-section');
    const urls = IMAGES[style] || IMAGES['moderne'];
    grid.innerHTML = '';

    urls.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Référence architecturale ' + style;
      img.loading = 'lazy';
      grid.appendChild(img);
    });

    imageSection.style.display = 'block';
  }

  async function generer() {
    const prompt     = document.getElementById('prompt').value.trim();
    const superficie = document.getElementById('superficie').value;
    const style      = document.getElementById('style').value;

    if (!prompt) { alert('Veuillez décrire votre projet.'); return; }

    const promptComplet = `${prompt}. Style : ${style}.${superficie ? ' Superficie : ' + superficie + ' m².' : ''}`;
    lastPrompt = promptComplet;

    const btn          = document.getElementById('generateBtn');
    const loader       = document.getElementById('loader');
    const result       = document.getElementById('result');
    const shareSection = document.getElementById('shareSection');
    const pdfBtn       = document.getElementById('pdf-btn');

    btn.disabled = true;
    loader.style.display = 'block';
    result.style.display = 'none';
    shareSection.style.display = 'none';
    pdfBtn.style.display = 'none';

    // Afficher les images immédiatement
    afficherImages(style);

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: promptComplet })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Erreur serveur');

      lastResult = data.result;
      document.getElementById('result-text').textContent = lastResult;
      result.style.display = 'block';
      pdfBtn.style.display = 'block';
      shareSection.style.display = 'block';

    } catch (err) {
      alert('Erreur : ' + err.message);
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  }

  function telechargerPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(22);
    doc.setTextColor(15, 30, 80);
    doc.text('ArchiAI - Plan Architectural', 20, 22);

    doc.setFontSize(11);
    doc.setTextColor(120);
    doc.text('Projet : ' + lastPrompt, 20, 34);
    doc.text('Genere le : ' + new Date().toLocaleDateString('fr-FR'), 20, 42);

    doc.setDrawColor(201, 168, 76);
    doc.setLineWidth(0.8);
    doc.line(20, 48, 190, 48);

    doc.setFontSize(11);
    doc.setTextColor(30);
    const lines = doc.splitTextToSize(lastResult, 170);
    doc.text(lines, 20, 58);

    doc.setFontSize(9);
    doc.setTextColor(160);
    doc.text('ArchiAI - Propulse par Groq IA', 20, 285);

    doc.save('plan-archi-ai.pdf');
  }

  function partager(type) {
    const texte = encodeURIComponent('🏠 Plan ArchiAI :\n\n' + lastResult);
    const url   = encodeURIComponent(window.location.href);
    const liens = {
      whatsapp: `https://wa.me/?text=${texte}`,
      telegram: `https://t.me/share/url?url=${url}&text=${texte}`,
      email:    `mailto:?subject=Mon plan ArchiAI&body=${texte}`,
      sms:      `sms:?body=${texte}`,
      linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${url}`
    };
    if (type === 'copy') {
      navigator.clipboard.writeText(lastResult);
      alert('Copie dans le presse-papier !');
    } else {
      window.open(liens[type], '_blank');
    }
  }
</script>

</body>
</html>
