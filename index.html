<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchiAI — Votre maison, conçue par l'IA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #0a0f1e;
      color: #f0e6c8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: linear-gradient(135deg, #0d1530, #1a2a5e);
      padding: 32px 20px;
      text-align: center;
      border-bottom: 2px solid #c9a84c;
    }
    header h1 { font-size: 2.4rem; color: #c9a84c; letter-spacing: 3px; text-transform: uppercase; }
    header p { font-size: 1rem; color: #b0bcd4; margin-top: 8px; }

    .container { width: 100%; max-width: 880px; padding: 36px 20px; }

    label {
      display: block; font-size: 0.78rem; letter-spacing: 2px;
      text-transform: uppercase; color: #c9a84c;
      margin-bottom: 8px; margin-top: 18px;
    }
    textarea, input[type="number"], select {
      width: 100%; padding: 13px 15px;
      background: #111827; border: 1px solid #c9a84c55;
      border-radius: 8px; color: #f0e6c8;
      font-size: 1rem; font-family: 'Georgia', serif;
      outline: none; transition: border 0.3s;
    }
    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus, select:focus { border-color: #c9a84c; }
    select option { background: #111827; }
    .row { display: flex; gap: 14px; }
    .row > div { flex: 1; }

    button#generateBtn {
      margin-top: 22px; width: 100%; padding: 16px;
      background: linear-gradient(135deg, #c9a84c, #a07830);
      color: #0a0f1e; font-size: 1.05rem; font-weight: bold;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 8px; cursor: pointer;
      transition: opacity 0.3s;
    }
    button#generateBtn:hover { opacity: 0.85; }
    button#generateBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loader { display: none; text-align: center; margin-top: 22px; color: #c9a84c; font-size: 0.95rem; letter-spacing: 2px; }

    .section-title {
      font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
      color: #c9a84c; margin-bottom: 14px; margin-top: 32px;
      border-left: 3px solid #c9a84c; padding-left: 10px;
    }

    /* PHOTOS */
    #image-section { display: none; }
    .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .image-grid img {
      width: 100%; height: 180px; object-fit: cover;
      border-radius: 8px; border: 1px solid #c9a84c33; transition: transform 0.2s;
    }
    .image-grid img:hover { transform: scale(1.02); }

    /* PLAN 2D + VUE 3D côte à côte */
    #plans-section { display: none; }
    .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .plan-box {
      background: #fff; border-radius: 10px;
      border: 2px solid #c9a84c; overflow: hidden;
    }
    .plan-box svg { width: 100%; height: auto; display: block; }
    .plan-label {
      background: #0d1530; color: #c9a84c;
      font-size: 0.75rem; letter-spacing: 2px;
      text-transform: uppercase; text-align: center;
      padding: 7px;
    }

    /* RÉSULTAT */
    #result {
      display: none; background: #111827;
      border: 1px solid #c9a84c44; border-radius: 10px; padding: 26px;
    }
    #result-text { color: #e8dfc8; white-space: pre-wrap; font-size: 0.96rem; line-height: 1.85; }

    /* BOUTONS ACTION */
    .action-buttons { display: none; gap: 12px; margin-top: 14px; flex-direction: row; }
    .action-buttons button {
      flex: 1; padding: 13px; font-size: 0.88rem; font-weight: bold;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 8px; cursor: pointer; transition: all 0.3s;
    }
    #pdf-btn { background: #1a2a5e; color: #c9a84c; border: 1px solid #c9a84c; }
    #pdf-btn:hover { background: #c9a84c; color: #0a0f1e; }
    #plan-pdf-btn { background: #0d1a0d; color: #4caf50; border: 1px solid #4caf50; }
    #plan-pdf-btn:hover { background: #4caf50; color: #fff; }

    /* PARTAGE */
    .share-section { margin-top: 14px; display: none; }
    .share-label { font-size: 0.78rem; color: #c9a84c; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .share-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .share-btn { padding: 9px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: bold; color: white; transition: opacity 0.2s; }
    .share-btn:hover { opacity: 0.8; }
    .btn-whatsapp { background: #25D366; }
    .btn-telegram { background: #0088CC; }
    .btn-email    { background: #555; }
    .btn-sms      { background: #8e44ad; }
    .btn-linkedin { background: #0077B5; }
    .btn-copy     { background: #c9a84c; color: #0a0f1e; }

    footer { margin-top: 60px; padding: 20px; text-align: center; font-size: 0.75rem; color: #3a4a6a; }

    @media (max-width: 600px) {
      .plans-grid { grid-template-columns: 1fr; }
      .image-grid { grid-template-columns: 1fr 1fr; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <h1>ArchiAI</h1>
  <p>Votre maison, conçue par l'IA &nbsp;|&nbsp; Your home, designed by AI</p>
</header>

<div class="container">

  <label for="prompt">Décrivez votre projet</label>
  <textarea id="prompt" placeholder="Ex : Villa avec 3 chambres, salon, cuisine ouverte, grande terrasse, piscine..."></textarea>

  <div class="row">
    <div>
      <label for="superficie">Superficie (m²)</label>
      <input type="number" id="superficie" placeholder="Ex : 150" min="30" max="10000" />
    </div>
    <div>
      <label for="pieces">Nombre de pièces</label>
      <input type="number" id="pieces" placeholder="Ex : 5" min="1" max="20" />
    </div>
    <div>
      <label for="style">Style architectural</label>
      <select id="style">
        <option value="moderne">Moderne</option>
        <option value="traditionnel africain">Traditionnel Africain</option>
        <option value="contemporain">Contemporain</option>
        <option value="minimaliste">Minimaliste</option>
        <option value="colonial">Colonial</option>
        <option value="tropical">Tropical</option>
      </select>
    </div>
  </div>

  <button id="generateBtn" onclick="generer()">✦ Générer le plan architectural</button>
  <div id="loader">⏳ Génération en cours...</div>

  <!-- PHOTOS -->
  <div id="image-section">
    <div class="section-title">🖼️ Références visuelles du projet</div>
    <div class="image-grid" id="image-grid"></div>
  </div>

  <!-- PLAN 2D + VUE 3D -->
  <div id="plans-section">
    <div class="section-title">📐 Vue en plan & Rendu 3D isométrique</div>
    <div class="plans-grid">
      <div>
        <div class="plan-label">📐 Plan 2D — Floor Plan</div>
        <div class="plan-box" id="plan2d-container"></div>
      </div>
      <div>
        <div class="plan-label">🏠 Vue 3D Isométrique</div>
        <div class="plan-box" id="plan3d-container"></div>
      </div>
    </div>
  </div>

  <!-- TEXTE -->
  <div id="result">
    <div class="section-title" style="margin-top:0">📋 Plan architectural généré</div>
    <div id="result-text"></div>
  </div>

  <!-- BOUTONS -->
  <div class="action-buttons" id="action-buttons">
    <button id="pdf-btn" onclick="telechargerPDF()">📄 Télécharger PDF</button>
    <button id="plan-pdf-btn" onclick="telechargerPlanPDF()">📐 Télécharger Plans PDF</button>
  </div>

  <!-- PARTAGE -->
  <div class="share-section" id="shareSection">
    <div class="share-label">Partager</div>
    <div class="share-buttons">
      <button class="share-btn btn-whatsapp" onclick="partager('whatsapp')">WhatsApp</button>
      <button class="share-btn btn-telegram" onclick="partager('telegram')">Telegram</button>
      <button class="share-btn btn-email"    onclick="partager('email')">Email</button>
      <button class="share-btn btn-sms"      onclick="partager('sms')">SMS</button>
      <button class="share-btn btn-linkedin" onclick="partager('linkedin')">LinkedIn</button>
      <button class="share-btn btn-copy"     onclick="partager('copy')">📋 Copier</button>
    </div>
  </div>

</div>
<footer>ArchiAI — Propulsé par Groq IA</footer>

<script>
  let lastResult = '', lastPrompt = '';

  // ── IMAGES PAR STYLE ─────────────────────────────────────────────────────────
  const IMAGES = {
    'moderne': [
      'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=600&q=80',
      'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600&q=80',
      'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600&q=80',
      'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600&q=80'
    ],
    'traditionnel africain': [
      'https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?w=600&q=80',
      'https://images.unsplash.com/photo-1580974852861-c381510bc98a?w=600&q=80',
      'https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=600&q=80',
      'https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=600&q=80'
    ],
    'contemporain': [
      'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=600&q=80',
      'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=600&q=80',
      'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=600&q=80',
      'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=600&q=80'
    ],
    'minimaliste': [
      'https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=600&q=80',
      'https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=600&q=80',
      'https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=600&q=80',
      'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80'
    ],
    'colonial': [
      'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600&q=80',
      'https://images.unsplash.com/photo-1582268611958-ebfd161ef9cf?w=600&q=80',
      'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600&q=80',
      'https://images.unsplash.com/photo-1576941089067-2de3c901e126?w=600&q=80'
    ],
    'tropical': [
      'https://images.unsplash.com/photo-1540541338537-1220059c3cca?w=600&q=80',
      'https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=600&q=80',
      'https://images.unsplash.com/photo-1439130490301-25e322d88054?w=600&q=80',
      'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80'
    ]
  };

  // ── COULEURS PAR STYLE ───────────────────────────────────────────────────────
  const COULEURS = {
    'moderne':               { mur:'#1a1a2e', fond:'#e8f4f8', accent:'#4fc3f7', toit:'#1a1a2e', facade:'#b0c4de', ombre:'#8fa8c8' },
    'traditionnel africain': { mur:'#3e2723', fond:'#fff8e1', accent:'#ff8f00', toit:'#5d4037', facade:'#d7b896', ombre:'#a07850' },
    'contemporain':          { mur:'#212121', fond:'#f5f5f5', accent:'#78909c', toit:'#37474f', facade:'#cfd8dc', ombre:'#90a4ae' },
    'minimaliste':           { mur:'#424242', fond:'#fafafa', accent:'#bdbdbd', toit:'#616161', facade:'#eeeeee', ombre:'#bdbdbd' },
    'colonial':              { mur:'#4e342e', fond:'#efebe9', accent:'#8d6e63', toit:'#6d4c41', facade:'#d7ccc8', ombre:'#a1887f' },
    'tropical':              { mur:'#1b5e20', fond:'#f1f8e9', accent:'#66bb6a', toit:'#2e7d32', facade:'#c8e6c9', ombre:'#81c784' }
  };

  // ── PLAN 2D SVG ──────────────────────────────────────────────────────────────
  function genererPlan2D(desc, nbPieces, superficie, style) {
    const W = 420, H = 360, mu = 6;
    const d = desc.toLowerCase();
    const aPiscine = d.includes('piscine'), aTerrasse = d.includes('terrasse'), aGarage = d.includes('garage');
    const n = Math.max(2, Math.min(parseInt(nbPieces)||4, 5));
    const c = COULEURS[style] || COULEURS['moderne'];

    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">`;
    s += `<rect width="${W}" height="${H}" fill="#f9f7f2"/>`;
    s += `<text x="${W/2}" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="${c.mur}" letter-spacing="1">PLAN 2D — FLOOR PLAN</text>`;

    const bx=30, by=28, bw=260, bh=230;
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${c.fond}" stroke="${c.mur}" stroke-width="${mu}" rx="3"/>`;

    // Salon gauche haut
    const sW=Math.round(bw*0.48), sH=Math.round(bh*0.55);
    s += piece(bx, by, sW, sH, 'SALON', c, mu, true);

    // Cuisine gauche bas
    s += piece(bx, by+sH, sW, bh-sH, 'CUISINE', c, mu);

    // Chambres droite
    const rX=bx+sW, rW=bw-sW;
    for(let i=0;i<n-2;i++){
      const ch=Math.round(bh/(n-2));
      const cy=by+i*ch;
      const cH=(i===n-3)?(by+bh-cy):ch;
      s += piece(rX, cy, rW, cH, i===0?'CH. PRINCIPALE':`CH. ${i+1}`, c, mu, i===0);
      // SDB
      const sbW=Math.round(rW*0.36), sbH=Math.round(cH*0.4);
      s += `<rect x="${rX+rW-sbW}" y="${cy+cH-sbH}" width="${sbW}" height="${sbH}" fill="#ddeeff" stroke="${c.mur}" stroke-width="2"/>`;
      s += `<text x="${rX+rW-sbW/2}" y="${cy+cH-sbH/2+3}" text-anchor="middle" font-size="7" fill="${c.mur}">SDB</text>`;
    }

    // Terrasse
    if(aTerrasse){
      s += `<rect x="${bx}" y="${by+bh}" width="${Math.round(bw*0.6)}" height="40" fill="#ffe0b2" stroke="${c.mur}" stroke-width="3" stroke-dasharray="5,3"/>`;
      s += `<text x="${bx+Math.round(bw*0.3)}" y="${by+bh+24}" text-anchor="middle" font-size="9" fill="${c.mur}" font-weight="bold">TERRASSE</text>`;
    }

    // Piscine
    if(aPiscine){
      const px=bx+(aTerrasse?Math.round(bw*0.62):0), py=by+bh+5;
      s += `<rect x="${px}" y="${py}" width="90" height="38" fill="#b3e5fc" stroke="#0288d1" stroke-width="2" rx="15"/>`;
      s += `<text x="${px+45}" y="${py+22}" text-anchor="middle" font-size="8" fill="#0288d1" font-weight="bold">PISCINE</text>`;
    }

    // Garage
    if(aGarage){
      s += `<rect x="${bx+bw+8}" y="${by}" width="68" height="80" fill="#e0e0e0" stroke="${c.mur}" stroke-width="3"/>`;
      s += `<text x="${bx+bw+42}" y="${by+45}" text-anchor="middle" font-size="8" fill="${c.mur}" font-weight="bold">GARAGE</text>`;
    }

    // Nord + échelle
    s += `<text x="${W-22}" y="40" text-anchor="middle" font-size="16" fill="${c.mur}">↑</text>`;
    s += `<text x="${W-22}" y="54" text-anchor="middle" font-size="8" fill="${c.mur}" font-weight="bold">N</text>`;
    if(superficie) s += `<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="8" fill="#888">Superficie : ${superficie} m²</text>`;

    s += `</svg>`;
    return s;
  }

  function piece(x, y, w, h, label, c, mu, principale) {
    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${principale?c.fond:'#fff'}" stroke="${c.mur}" stroke-width="${mu}"/>`;
    const pt = 22;
    s += `<line x1="${x+pt}" y1="${y+h}" x2="${x+pt}" y2="${y+h-pt}" stroke="${c.mur}" stroke-width="1.5"/>`;
    s += `<path d="M${x},${y+h} a${pt},${pt} 0 0,1 ${pt},${-pt}" fill="none" stroke="${c.accent}" stroke-width="1.2"/>`;
    s += `<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="9" font-weight="bold" fill="${c.mur}">${label}</text>`;
    return s;
  }

  // ── VUE 3D ISOMÉTRIQUE SVG ───────────────────────────────────────────────────
  function genererVue3D(desc, nbPieces, superficie, style) {
    const W = 420, H = 360;
    const d = desc.toLowerCase();
    const aPiscine  = d.includes('piscine');
    const aTerrasse = d.includes('terrasse');
    const aGarage   = d.includes('garage');
    const n = Math.max(2, Math.min(parseInt(nbPieces)||4, 5));
    const c = COULEURS[style] || COULEURS['moderne'];

    // Transformation isométrique
    function iso(gx, gy, gz) {
      return {
        x: W/2 + (gx - gy) * 28,
        y: H/2 + (gx + gy) * 14 - gz * 26
      };
    }

    function quad(pts, fill, stroke, sw=1) {
      const d = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+'Z';
      return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    }

    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">`;
    s += `<rect width="${W}" height="${H}" fill="#f0f4f8"/>`;
    s += `<text x="${W/2}" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="${c.mur}" letter-spacing="1">VUE 3D ISOMÉTRIQUE</text>`;

    // Sol / terrain
    const solPts = [iso(0,0,0), iso(6,0,0), iso(6,5,0), iso(0,5,0)];
    s += quad(solPts, '#d4e8a0', '#a0c060', 1);

    // ── Corps principal de la maison ─────────────────────────────────────────
    const mH = 1.6; // hauteur murs
    // Face sol
    const basePts = [iso(0.5,0.5,0), iso(4.5,0.5,0), iso(4.5,3.5,0), iso(0.5,3.5,0)];
    s += quad(basePts, c.fond, c.mur, 1);

    // Face avant (sud)
    const fAvant = [iso(0.5,3.5,0), iso(4.5,3.5,0), iso(4.5,3.5,mH), iso(0.5,3.5,mH)];
    s += quad(fAvant, c.facade, c.mur, 1.5);

    // Face droite (est)
    const fDroite = [iso(4.5,0.5,0), iso(4.5,3.5,0), iso(4.5,3.5,mH), iso(4.5,0.5,mH)];
    s += quad(fDroite, c.ombre, c.mur, 1.5);

    // ── Toit ─────────────────────────────────────────────────────────────────
    if(style === 'traditionnel africain' || style === 'tropical') {
      // Toit à 4 pans
      const apex = iso(2.5, 2, mH+1.4);
      [[iso(0.5,0.5,mH),iso(4.5,0.5,mH)],[iso(4.5,0.5,mH),iso(4.5,3.5,mH)],
       [iso(4.5,3.5,mH),iso(0.5,3.5,mH)],[iso(0.5,3.5,mH),iso(0.5,0.5,mH)]].forEach((edge,i) => {
        const col = i<2 ? c.toit : (i===2 ? '#8d6e63' : c.ombre);
        s += `<path d="M${edge[0].x.toFixed(1)},${edge[0].y.toFixed(1)} L${apex.x.toFixed(1)},${apex.y.toFixed(1)} L${edge[1].x.toFixed(1)},${edge[1].y.toFixed(1)} Z" fill="${col}" stroke="${c.mur}" stroke-width="1.2"/>`;
      });
    } else {
      // Toit plat avec débord
      const toitTop = [iso(0.2,0.2,mH), iso(4.8,0.2,mH), iso(4.8,3.8,mH), iso(0.2,3.8,mH)];
      s += quad(toitTop, c.toit, c.mur, 1.5);
      // Bordure toit
      const toitBot = [iso(0.5,0.5,mH), iso(4.5,0.5,mH), iso(4.5,3.5,mH), iso(0.5,3.5,mH)];
      const bordH = 0.15;
      [
        [iso(0.2,3.8,mH),iso(4.8,3.8,mH),iso(4.8,3.8,mH-bordH),iso(0.2,3.8,mH-bordH)],
        [iso(4.8,0.2,mH),iso(4.8,3.8,mH),iso(4.8,3.8,mH-bordH),iso(4.8,0.2,mH-bordH)]
      ].forEach(pts => s += quad(pts, c.ombre, c.mur, 1));
    }

    // ── Fenêtres façade avant ────────────────────────────────────────────────
    for(let i=0;i<Math.min(n-1,3);i++){
      const wx = 0.8 + i*1.2, wy = 3.5, wz0 = 0.5, wz1 = 1.1;
      if(wx < 4.2) {
        const fenPts = [iso(wx,wy,wz0), iso(wx+0.7,wy,wz0), iso(wx+0.7,wy,wz1), iso(wx,wy,wz1)];
        s += quad(fenPts, '#b3d9f7', c.mur, 1);
        const mfx = iso(wx+0.35, wy, (wz0+wz1)/2);
        s += `<line x1="${iso(wx,wy,(wz0+wz1)/2).x.toFixed(1)}" y1="${iso(wx,wy,(wz0+wz1)/2).y.toFixed(1)}" x2="${iso(wx+0.7,wy,(wz0+wz1)/2).x.toFixed(1)}" y2="${iso(wx+0.7,wy,(wz0+wz1)/2).y.toFixed(1)}" stroke="${c.mur}" stroke-width="0.8"/>`;
        s += `<line x1="${mfx.x.toFixed(1)}" y1="${iso(wx+0.35,wy,wz0).y.toFixed(1)}" x2="${mfx.x.toFixed(1)}" y2="${iso(wx+0.35,wy,wz1).y.toFixed(1)}" stroke="${c.mur}" stroke-width="0.8"/>`;
      }
    }

    // ── Porte ────────────────────────────────────────────────────────────────
    const portePts = [iso(1.9,3.5,0), iso(2.7,3.5,0), iso(2.7,3.5,1.0), iso(1.9,3.5,1.0)];
    s += quad(portePts, '#8d6e63', c.mur, 1.5);
    const pc = iso(2.3, 3.5, 0.5);
    s += `<circle cx="${pc.x.toFixed(1)}" cy="${pc.y.toFixed(1)}" r="3" fill="${c.accent}"/>`;

    // ── Terrasse ─────────────────────────────────────────────────────────────
    if(aTerrasse){
      const tPts = [iso(0.5,3.5,0.05), iso(3.5,3.5,0.05), iso(3.5,5,0.05), iso(0.5,5,0.05)];
      s += quad(tPts, '#ffe0b2', '#c9a84c', 1.5);
      // Rambarde terrasse
      [[iso(0.5,3.5,0.05),iso(0.5,5,0.05)],[iso(3.5,3.5,0.05),iso(3.5,5,0.05)]].forEach(edge => {
        const h=0.5;
        s += `<line x1="${edge[0].x.toFixed(1)}" y1="${(edge[0].y-h*26).toFixed(1)}" x2="${edge[1].x.toFixed(1)}" y2="${(edge[1].y-h*26).toFixed(1)}" stroke="${c.accent}" stroke-width="1.5"/>`;
        s += `<line x1="${edge[0].x.toFixed(1)}" y1="${edge[0].y.toFixed(1)}" x2="${edge[0].x.toFixed(1)}" y2="${(edge[0].y-h*26).toFixed(1)}" stroke="${c.accent}" stroke-width="1.2"/>`;
      });
      const tLabel = iso(2, 4.2, 0.1);
      s += `<text x="${tLabel.x.toFixed(1)}" y="${tLabel.y.toFixed(1)}" text-anchor="middle" font-size="8" fill="${c.mur}" font-weight="bold">TERRASSE</text>`;
    }

    // ── Piscine ───────────────────────────────────────────────────────────────
    if(aPiscine){
      const pPts = [iso(aTerrasse?3.8:0.5, 3.8, 0), iso(5.5, 3.8, 0), iso(5.5, 4.8, 0), iso(aTerrasse?3.8:0.5, 4.8, 0)];
      s += quad(pPts, '#81d4fa', '#0288d1', 2);
      // Eau (vagues)
      for(let w=0;w<3;w++){
        const w1 = iso(aTerrasse?4.1+w*0.4:0.8+w*0.4, 4.1, 0.02);
        const w2 = iso(aTerrasse?4.3+w*0.4:1.0+w*0.4, 4.3, 0.02);
        s += `<line x1="${w1.x.toFixed(1)}" y1="${w1.y.toFixed(1)}" x2="${w2.x.toFixed(1)}" y2="${w2.y.toFixed(1)}" stroke="#4fc3f7" stroke-width="1.5"/>`;
      }
      const pc2 = iso(aTerrasse?4.65:1.5, 4.3, 0.05);
      s += `<text x="${pc2.x.toFixed(1)}" y="${pc2.y.toFixed(1)}" text-anchor="middle" font-size="8" fill="#0277bd" font-weight="bold">PISCINE</text>`;
    }

    // ── Garage ────────────────────────────────────────────────────────────────
    if(aGarage){
      const gH = 1.2;
      const gAvant = [iso(4.5,0.5,0), iso(5.8,0.5,0), iso(5.8,2,0), iso(4.5,2,0)];
      s += quad(gAvant, c.fond, c.mur, 1);
      const gFaceAv = [iso(4.5,2,0), iso(5.8,2,0), iso(5.8,2,gH), iso(4.5,2,gH)];
      s += quad(gFaceAv, c.facade, c.mur, 1.2);
      const gFaceDr = [iso(5.8,0.5,0), iso(5.8,2,0), iso(5.8,2,gH), iso(5.8,0.5,gH)];
      s += quad(gFaceDr, c.ombre, c.mur, 1.2);
      const gToit = [iso(4.4,0.4,gH), iso(5.9,0.4,gH), iso(5.9,2.1,gH), iso(4.4,2.1,gH)];
      s += quad(gToit, c.toit, c.mur, 1);
      // Porte garage
      const gpPts = [iso(4.5,2,0), iso(5.8,2,0), iso(5.8,2,0.9), iso(4.5,2,0.9)];
      s += quad(gpPts, '#9e9e9e', c.mur, 1);
      const gl = iso(5.15, 2, 0.45);
      s += `<text x="${gl.x.toFixed(1)}" y="${gl.y.toFixed(1)}" text-anchor="middle" font-size="7" fill="${c.mur}">GARAGE</text>`;
    }

    // ── Végétation ────────────────────────────────────────────────────────────
    [[0.2,0.3],[5.5,0.3],[5.5,4.5],[0.2,4.5]].forEach(([gx,gy])=>{
      const base = iso(gx, gy, 0);
      const haut = iso(gx, gy, 0.7);
      s += `<line x1="${base.x.toFixed(1)}" y1="${base.y.toFixed(1)}" x2="${haut.x.toFixed(1)}" y2="${haut.y.toFixed(1)}" stroke="#5d4037" stroke-width="2"/>`;
      s += `<circle cx="${haut.x.toFixed(1)}" cy="${(haut.y-8).toFixed(1)}" r="9" fill="${style==='tropical'?'#2e7d32':'#388e3c'}" opacity="0.85"/>`;
    });

    // Titre
    s += `<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="8" fill="#888">Vue isométrique — Style ${style}</text>`;
    s += `</svg>`;
    return s;
  }

  // ── AFFICHER IMAGES ──────────────────────────────────────────────────────────
  function afficherImages(style) {
    const grid = document.getElementById('image-grid');
    const sec  = document.getElementById('image-section');
    const urls = IMAGES[style] || IMAGES['moderne'];
    grid.innerHTML = '';
    urls.forEach(url => {
      const img = document.createElement('img');
      img.src = url; img.alt = 'Référence';
      img.loading = 'lazy';
      img.onerror = () => { img.style.display='none'; };
      grid.appendChild(img);
    });
    sec.style.display = 'block';
  }

  // ── GÉNÉRER ──────────────────────────────────────────────────────────────────
  async function generer() {
    const prompt     = document.getElementById('prompt').value.trim();
    const superficie = document.getElementById('superficie').value;
    const pieces     = document.getElementById('pieces').value;
    const style      = document.getElementById('style').value;
    if(!prompt){ alert('Veuillez décrire votre projet.'); return; }

    const promptComplet = `${prompt}. Style : ${style}.${superficie?' Superficie : '+superficie+' m².':''}${pieces?' Nombre de pièces : '+pieces+'.':''}`;
    lastPrompt = promptComplet;

    const btn          = document.getElementById('generateBtn');
    const loader       = document.getElementById('loader');
    const result       = document.getElementById('result');
    const shareSection = document.getElementById('shareSection');
    const actionBtns   = document.getElementById('action-buttons');
    const plansSection = document.getElementById('plans-section');

    btn.disabled=true; loader.style.display='block';
    result.style.display='none'; shareSection.style.display='none';
    actionBtns.style.display='none'; plansSection.style.display='none';

    // Photos immédiatement
    afficherImages(style);

    // Plans 2D + 3D immédiatement
    document.getElementById('plan2d-container').innerHTML = genererPlan2D(prompt, pieces, superficie, style);
    document.getElementById('plan3d-container').innerHTML = genererVue3D(prompt, pieces, superficie, style);
    plansSection.style.display = 'block';

    try {
      const response = await fetch('/api/generate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ prompt: promptComplet })
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error||'Erreur serveur');
      lastResult = data.result;
      document.getElementById('result-text').textContent = lastResult;
      result.style.display='block';
      actionBtns.style.display='flex';
      shareSection.style.display='block';
    } catch(err) {
      alert('Erreur : '+err.message);
    } finally {
      btn.disabled=false; loader.style.display='none';
    }
  }

  // ── PDF TEXTE ────────────────────────────────────────────────────────────────
  function telechargerPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(20); doc.setTextColor(15,30,80);
    doc.text('ArchiAI - Plan Architectural', 20, 22);
    doc.setFontSize(11); doc.setTextColor(120);
    doc.text('Projet : '+lastPrompt.substring(0,80), 20, 34);
    doc.text('Genere le : '+new Date().toLocaleDateString('fr-FR'), 20, 42);
    doc.setDrawColor(201,168,76); doc.setLineWidth(0.8); doc.line(20,48,190,48);
    doc.setFontSize(11); doc.setTextColor(30);
    doc.text(doc.splitTextToSize(lastResult,170), 20, 58);
    doc.setFontSize(9); doc.setTextColor(160);
    doc.text('ArchiAI - Propulse par Groq IA', 20, 285);
    doc.save('plan-archi-ai.pdf');
  }

  // ── PDF PLANS ────────────────────────────────────────────────────────────────
  function svgToCanvas(svgEl, w, h, cb) {
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx = canvas.getContext('2d');
    const data = new XMLSerializer().serializeToString(svgEl);
    const blob = new Blob([data],{type:'image/svg+xml;charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      ctx.fillStyle='#f0f4f8'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cb(canvas.toDataURL('image/png'));
    };
    img.src = url;
  }

  function telechargerPlanPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', format:'a4'});
    const svg2D = document.querySelector('#plan2d-container svg');
    const svg3D = document.querySelector('#plan3d-container svg');
    if(!svg2D||!svg3D){ alert('Aucun plan à télécharger.'); return; }

    doc.setFontSize(16); doc.setTextColor(15,30,80);
    doc.text('ArchiAI - Plans Architecturaux', 20, 16);
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(lastPrompt.substring(0,100), 20, 24);
    doc.setDrawColor(201,168,76); doc.line(20,28,277,28);

    svgToCanvas(svg2D,420,360,(img2D)=>{
      doc.addImage(img2D,'PNG',15,32,128,110);
      doc.setFontSize(8); doc.setTextColor(80);
      doc.text('Plan 2D — Floor Plan', 15, 146);

      svgToCanvas(svg3D,420,360,(img3D)=>{
        doc.addImage(img3D,'PNG',148,32,128,110);
        doc.text('Vue 3D Isométrique', 148, 146);
        doc.setFontSize(7); doc.setTextColor(160);
        doc.text('ArchiAI - '+new Date().toLocaleDateString('fr-FR'), 20, 205);
        doc.save('plans-archi-ai.pdf');
      });
    });
  }

  // ── PARTAGE ──────────────────────────────────────────────────────────────────
  function partager(type) {
    const texte = encodeURIComponent('🏠 Plan ArchiAI :\n\n'+lastResult);
    const url   = encodeURIComponent(window.location.href);
    const liens = {
      whatsapp:`https://wa.me/?text=${texte}`,
      telegram:`https://t.me/share/url?url=${url}&text=${texte}`,
      email:`mailto:?subject=Mon plan ArchiAI&body=${texte}`,
      sms:`sms:?body=${texte}`,
      linkedin:`https://www.linkedin.com/sharing/share-offsite/?url=${url}`
    };
    if(type==='copy'){ navigator.clipboard.writeText(lastResult); alert('Copié !'); }
    else window.open(liens[type],'_blank');
  }
</script>
